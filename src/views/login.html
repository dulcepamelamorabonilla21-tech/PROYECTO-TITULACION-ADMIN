<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ProInvest - Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <section class="login-hero">
      <div class="login-hero-content">
        <p class="login-kicker">PROINVEST MEXICO</p>
        <h1>Panel Corporativo de Administracion</h1>
        <p>Gestiona asesores, asignaciones y seguimiento comercial desde un solo centro de control.</p>
      </div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <h2>Acceso Administrador</h2>
        <p>Ingreso exclusivo para cuentas con permisos de administracion.</p>

        <form id="loginForm">
          <label for="email">Correo admin</label>
          <input id="email" type="email" placeholder="admin@proinvest.mx" required>

          <label for="password">Contrasena</label>
          <input id="password" type="password" placeholder="********" required>

          <button type="submit">Entrar al panel</button>
          <div id="msg" class="msg"></div>
        </form>
      </div>
    </section>
  </div>

  <script src="/login.js"></script>
</body>
</html>
