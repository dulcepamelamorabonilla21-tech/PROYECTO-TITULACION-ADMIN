<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin ProInvest - Panel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Panel Administrativo</h1>
        <p id="adminInfo">Sesion activa</p>
      </div>
      <button id="logoutBtn" class="logout">Cerrar sesion</button>
    </div>

    <div class="card" style="margin-bottom: 16px;">
      <h2>Alta de asesor</h2>
      <p>Solo usuarios con rol admin pueden crear asesores.</p>
      <form id="advisorForm">
        <div class="row">
          <div>
            <label for="nombre">Nombre</label>
            <input id="nombre" type="text" required>
          </div>
          <div>
            <label for="email">Correo corporativo</label>
            <input id="email" type="email" required>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="password">Contrasena</label>
            <input id="password" type="password" minlength="8" required>
          </div>
          <div>
            <label for="confirmPassword">Confirmar contrasena</label>
            <input id="confirmPassword" type="password" minlength="8" required>
          </div>
        </div>
        <button type="submit">Crear asesor</button>
        <div id="msg" class="msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>Asesores registrados</h2>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Estatus</th>
            <th>Creacion</th>
            <th>Accion</th>
          </tr>
        </thead>
        <tbody id="advisorTable"></tbody>
      </table>
    </div>

    <div class="card" style="margin-top: 16px;">
      <h2>Clientes registrados</h2>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>Servicio</th>
            <th>Mensaje</th>
            <th>Creacion</th>
          </tr>
        </thead>
        <tbody id="clientTable"></tbody>
      </table>
    </div>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
